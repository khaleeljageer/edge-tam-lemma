[project]
name = "tel"
version = "0.1.0"
description = "Compact neural lemmatization for Tamil on edge devices"
authors = [{ name = "SyedKhaleel Jageer", email = "jskcse4@gmail.com" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "torch>=2.5",
]

[dependency-groups]
export = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "pnnx>=20260526",
    "ncnn>=1.0.20260526",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Figure and table scripts in paper/figures/.
paper = [
    "matplotlib>=3.9",
]

[tool.uv]
default-groups = ["dev", "export", "paper"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
