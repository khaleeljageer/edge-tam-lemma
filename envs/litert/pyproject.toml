# Export / run models with LiteRT (TFLite). Separate env: litert-torch pins torch 2.13.
#   uv run --project envs/litert python -m tel.export runs/<name> --runtime litert
[project]
name = "tel-env-litert"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "tel",
    "litert-torch==0.9.4",
    "ai-edge-litert==2.2.0",
    "torch==2.13.0",
]

[tool.uv]
package = false

[tool.uv.sources]
tel = { path = "../..", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
