# M3 ablation base: dilated CNN encoder + the same attention LSTM decoder as lstm.yaml.
# Only the encoder differs, isolating its effect on accuracy and speed.
name: char_cnn
model:
  type: char_cnn
  emb: 64
  layers: 1
  conv_layers: 4
  kernel: 3
  dropout: 0.2
data:
  tokenizer: codepoint
  max_len: 48
train:
  epochs: 80
  batch_size: 32
  lr: 0.002
  patience: 12
