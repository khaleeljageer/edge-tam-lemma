# M3 step 5: edit_kd.yaml with the expanded gold (data/expanded/train.tsv) under the
# teacher_lstm-labelled Wikipedia words (tel.distill --gold). Compare with edit_kd_<size>.
name: edit_kd_exp
model:
  type: edit_classifier
  emb: 64
  layers: 3
  kernel: 3
  dropout: 0.2
data:
  tokenizer: codepoint
  max_len: 48
  train_file: data/distill/teacher_lstm_wiki20k_exp/train.tsv
train:
  epochs: 80
  batch_size: 32
  lr: 0.002
  patience: 12
edit:
  top_k: null
