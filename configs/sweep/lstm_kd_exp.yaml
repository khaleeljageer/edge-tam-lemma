# M3 step 5: lstm_kd.yaml with the expanded gold (data/expanded/train.tsv) under the
# teacher_lstm-labelled Wikipedia words (tel.distill --gold). Compare with lstm_kd_<size>.
name: lstm_kd_exp
model:
  type: lstm_seq2seq
  emb: 64
  layers: 1
  dropout: 0.2
data:
  tokenizer: codepoint
  max_len: 48
  train_file: data/distill/teacher_lstm_wiki20k_exp/train.tsv
train:
  epochs: 80
  batch_size: 32
  lr: 0.002
  patience: 12
