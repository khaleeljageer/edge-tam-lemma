# M3 sweep base: BiLSTM encoder + attention LSTM decoder. Size and seed are set by tel.sweep.
# Evaluated greedily (as deployed on device).
name: lstm
model:
  type: lstm_seq2seq
  emb: 64
  layers: 1
  dropout: 0.2
data:
  tokenizer: codepoint
  max_len: 48
train:
  epochs: 80
  batch_size: 32
  lr: 0.002
  patience: 12
