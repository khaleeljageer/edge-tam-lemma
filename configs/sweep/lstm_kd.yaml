# M3 distillation: lstm.yaml trained on teacher_lstm-labelled data (gold train +
# 9,012 Wikipedia words, per-token prob >= 0.9; see tel.distill). Compare with lstm_<size>.
name: lstm_kd
model:
  type: lstm_seq2seq
  emb: 64
  layers: 1
  dropout: 0.2
data:
  tokenizer: codepoint
  max_len: 48
  train_file: data/distill/teacher_lstm_wiki20k/train.tsv
train:
  epochs: 80
  batch_size: 32
  lr: 0.002
  patience: 12
